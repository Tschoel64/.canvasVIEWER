<style>

<script>
const $=s=>document.querySelector(s),st=$('#st'),W=$('#w'),ES=$('#es'),mm=$('#mm');

/* ---------- Markdown ---------- */
function inl(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^\w*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/==(.+?)==/g,'<mark>$1</mark>')

.replace(/\[\[([^\]]+)\]\]/g,(m,a)=>{const p=a.split('|');return '<span class="wl">'+(p[1]||p[0].split('#')[0])+'</span>'})
.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md0(t){const o=[];let list=null,code=false,buf=[];const close=()=>{if(list){o.push('</'+list+'>');list=null}};

if(code){buf.push(l);continue}

const X=[],SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,cells=l=>l.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim());

function md(t){X.length=0;
t=t.split(/(```[\s\S]*?```)/).map((s,i)=>i%2?s:s.replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>mth(a,1)).split(/(`[^`\n]*`)/).map((u,j)=>j%2?u:u.replace(/\$(?=\S)([^$\n]*?\S)\$/g,(m,a)=>mth(a,0))).join('')).join('');

for(let i=0;i<L.length;i++){const l=L[i];
if(/^```/.test(l)){f=!f;o.push(l);continue}
if(f){o.push(l);continue}
if(l.includes('|')&&!SEP.test(l)&&SEP.test(L[i+1]||'')){const al=cells(L[i+1]).map(c=>/^:.*:$/.test(c)?'center':/:$/.test(c)?'right':'left');
let h='<table><thead><tr>'+cells(l).map((c,k)=>`<th style="text-align:${al[k]||'left'}">${inl(c)}</th>`).join('')+'</tr></thead><tbody>';i+=2;
for(;i<L.length&&L[i].includes('|')&&L[i].trim();i++)h+='<tr>'+cells(L[i]).map((c,k)=>`<td style="text-align:${al[k]||'left'}">${inl(c)}</td>`).join('')+'</tr>';i--;o.push(ph(h+'</tbody></table>'));continue}

o.push(l)}
let s=md0(o.join('\n')).replace(/<p>\u0002(\d+)\u0002<\/p>/g,(a,n)=>X[n]);
for(let k=0;k<3;k++)s=s.replace(/\u0002(\d+)\u0002/g,(a,n)=>X[n]);return s}
/* ---------- GitHub ---------- */
async function gh(path,raw){
const u=`https://api.github.com/repos/${cfg.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}${cfg.branch?'?ref='+encodeURIComponent(cfg.branch):''}`;
const h={Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'};if(cfg.token)h.Authorization='Bearer '+cfg.token;
const r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return r}
const db=new Promise(r=>{try{const q=indexedDB.open('cv',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});

async function fileBlob(p,force){
if(!cur||!cur.repo||/^https?:/.test(p))return null;
const dir=cur.path?cur.path.split('/').slice(0,-1).join('/'):'',cs=[p,dir?dir+'/'+p:p],K=c=>'f:'+cur.repo+'@'+cur.branch+':'+c;
if(!force)for(const c of cs){if(FB[c])return FB[c];const b=await kvGet(K(c));if(b)return FB[c]=b}
for(const c of cs){try{const b=await(await gh(c,true)).blob();FB[c]=b;kvSet(K(c),b);return b}catch{}}return null}
function fixImgs(el){el.querySelectorAll('img[data-p]').forEach(async i=>{const p=i.dataset.p;if(/^https?:/.test(p)){i.src=p;return}const b=await fileBlob(p);if(b)i.src=URL.createObjectURL(b);else i.alt=p})}

/* ---------- Rendering ---------- */
const ttl=n=>n.type=='file'?n.file.split('/').pop():n.type=='link'?n.url:(n.text||'').split('\n').map(l=>l.replace(/\[!\w+\][+-]?|^([>#*+\-\s]|\d+\.\s)+|\*\*|`|\[\[|\]\]|~~|==|\$/g,'').trim()).filter(Boolean).slice(0,4).join('\n');
function anchor(n,s){return s=='top'?[n.x+n.width/2,n.y]:s=='bottom'?[n.x+n.width/2,n.y+n.height]:s=='left'?[n.x,n.y+n.height/2]:[n.x+n.width,n.y+n.height/2]}
const DIR={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
function show(text,name,view){
let c;try{c=JSON.parse(text)}catch{toast('Keine gültige .canvas-Datei');return}
W.querySelectorAll('.n,.g,.el').forEach(e=>e.remove());ES.innerHTML='';EG=[];Object.keys(FB).forEach(k=>delete FB[k]);NS=c.nodes||[];const by={};
const order=[...NS.filter(n=>n.type=='group'),...NS.filter(n=>n.type!='group')];
for(const n of order){by[n.id]=n;const c1=col(n.color);const d=document.createElement('div');
d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.width}px;height:${n.height}px`;if(c1){d.style.setProperty('--c',c1)}
n.el=d;n.s=(n.text||n.file||n.url||n.label||'').toLowerCase();
if(n.type=='group'){d.className='g';d.innerHTML=n.label?`<div class="gl">${esc(n.label)}</div>`:''}
else{d.className='n'+(c1?' col':'');
if(n.type=='file'){d.innerHTML=`<div class="ft">${esc(n.file.split('/').pop())}</div><div class="in"></div>`;loadFile(n,d.querySelector('.in'))}
else if(n.type=='link')d.innerHTML=`<div class="in"><div class="lk"><div class="mu">Link</div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></div></div>`;
else{d.innerHTML=`<div class="in"><div class="md">${md(n.text||'')}</div></div>`;fixImgs(d)}}
if(n.type!='group'){const lt=document.createElement('div');lt.className='lt';lt.textContent=ttl(n);d.appendChild(lt)}W.appendChild(d)}
/* Edges */
const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');ES.appendChild(defs);const mk={};
const marker=c=>{if(mk[c])return mk[c];const id='m'+Object.keys(mk).length;mk[c]=id;defs.insertAdjacentHTML('beforeend',`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`);return id};

const p=anchor(a,fs),q=anchor(b,ts),dist=Math.hypot(p[0]-q[0],p[1]-q[1]),k=Math.min(220,Math.max(40,dist/2));

const to=e.toEnd||'arrow',fr=e.fromEnd||'none';
ES.insertAdjacentHTML('beforeend',`<path d="M${p}C${c_1} ${c_2} ${q}" fill="none" stroke="${c1}" stroke-width="2" stroke-linecap="round" ${to=='arrow'?`marker-end="url(#${marker(c1)})"`:''}/>`);
EG.push({el:ES.lastElementChild,p,q,c_1,c_2,c:c1,to,label:e.label,x0:Math.min(p[0],q[0],c_1[0],c_2[0]),x1:Math.max(p[0],q[0],c_1[0],c_2[0]),y0:Math.min(p[1],q[1],c_1[1],c_2[1]),y1:Math.max(p[1],q[1],c_1[1],c_2[1])});
if(e.label){const l=document.createElement('div');l.className='el';l.textContent=e.label;
l.style.left=(p[0]+3*c_1[0]+3*c_2[0]+q[0])/8+'px';l.style.top=(p[1]+3*c_1[1]+3*c_2[1]+q[1])/8+'px';if(e.color)l.style.borderColor=c1;W.appendChild(l)}}

/* Gesten */
const P=new Map();let dn=null,lastTap=0;

else if(P.size==2){const o2=P.get([...P.keys()].find(i=>i!=e.pointerId)),d0=Math.hypot(o[0]-o2[0],o[1]-o2[1])||1,d1=Math.hypot(n[0]-o2[0],n[1]-o2[1])||1;
V.x+=(n[0]-o[0])/2;V.y+=(n[1]-o[1])/2;zoomAt((n[0]+o2[0])/2,(n[1]+o2[1])/2,d1/d0)}

a.sort((x,y)=>(y.type=='dir')-(x.type=='dir')||x.name.localeCompare(y.name));

catch(e){t=await kvGet(key);if(!t)return toast('Laden fehlgeschlagen ('+e.message+')');toast('Offline: gespeicherte Version')}

function wrap(x,n,t,tx){let y=n.y+10;const mw=n.width-32;
for(let l of t.split('\n')){const hd=l.match(/^(#{1,6})\s/),sz=hd?[0,28,24,20,18,16,16][hd[1].length]:16,lh=sz*1.4;
l=l.replace(/^#+\s|\*\*|`|\[\[|\]\]|~~|==/g,'').replace(/^\s*[-*+]\s+/,'• ');x.font=(hd?'700 ':'')+sz+'px -apple-system,sans-serif';x.fillStyle=tx;
if(!l.trim()){y+=8;continue}let ln='';
for(const w of l.split(' ')){const u=ln?ln+' '+w:w;if(x.measureText(u).width>mw&&ln){y+=lh;if(y-sz>n.y+n.height)return;x.fillText(ln,n.x+16,y);ln=w}else ln=u}
y+=lh;if(y-sz>n.y+n.height)return;x.fillText(ln,n.x+16,y)}}
$('#png').onclick=async()=>{if(!B)return;toast('Erstelle PNG …');
const cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim(),pad=60,w=B.w+pad*2,h=B.h+pad*2,s=Math.min(2,Math.sqrt(1.4e7/(w*h)),7800/Math.max(w,h));
const c=document.createElement('canvas');c.width=w*s|0;c.height=h*s|0;const x=c.getContext('2d');x.scale(s,s);x.fillStyle=v('--bg');x.fillRect(0,0,w,h);x.translate(pad-B.x,pad-B.y);
const F='-apple-system,BlinkMacSystemFont,sans-serif',tint=(k,a)=>{x.globalAlpha=a;x.fillStyle=k;x.fill();x.globalAlpha=1},rr=(n,r)=>{x.beginPath();x.roundRect(n.x,n.y,n.width,n.height,r)};
for(const n of NS.filter(n=>n.type=='group')){const k=col(n.color)||v('--bd');rr(n,14);tint(k,.08);x.strokeStyle=k;x.lineWidth=2;x.stroke();if(n.label){x.font='15px '+F;x.fillStyle=v('--tx');x.fillText(n.label,n.x+8,n.y-12)}}
x.lineWidth=2;

if(e.label){const m=[(e.p[0]+3*e.c_1[0]+3*e.c_2[0]+e.q[0])/8,(e.p[1]+3*e.c_1[1]+3*e.c_2[1]+e.q[1])/8];x.font='13px '+F;const tw=x.measureText(e.label).width;x.fillStyle=v('--bg');x.fillRect(m[0]-tw/2-8,m[1]-11,tw+16,22);x.fillStyle=v('--tx');x.fillText(e.label,m[0]-tw/2,m[1]+4)}}
for(const n of NS.filter(n=>n.type!='group')){const k=col(n.color)||v('--bd');rr(n,8);x.fillStyle=v('--card');x.fill();if(n.color)tint(k,.09);
