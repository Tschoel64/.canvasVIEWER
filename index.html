<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-text-size-adjust:100%}
#st{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#w{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#es{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.n,.g{position:absolute;border:2px solid var(--c,var(--bd));border-radius:8px;background:var(--card)}
.n.col{background:color-mix(in srgb,var(--c) 9%,var(--card))}
.g{border-radius:14px;background:color-mix(in srgb,var(--c,#888) 8%,transparent)}
.gl{position:absolute;left:-2px;bottom:100%;margin-bottom:8px;padding:1px 10px;border-radius:8px;background:color-mix(in srgb,var(--c,#888) 22%,var(--bg));white-space:nowrap;font-size:15px}
.in{position:absolute;inset:0;overflow:hidden;border-radius:6px}
.ft{position:absolute;left:2px;bottom:100%;margin-bottom:4px;font-size:13px;color:var(--mu);white-space:nowrap}
.md{padding:12px 16px;word-wrap:break-word}.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.5em 0}.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.7em 0 .3em;line-height:1.25;font-weight:700}
.md h1{font-size:1.8em}.md h2{font-size:1.5em}.md h3{font-size:1.25em}.md h4{font-size:1.1em}.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}.md li.t{list-style:none;margin-left:-1.3em}.md li.t input{margin:0 .4em 0 0;vertical-align:-1px}
.md code{font:.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:color-mix(in srgb,var(--tx) 10%,transparent);padding:.1em .35em;border-radius:4px}
.md pre{background:color-mix(in srgb,var(--tx) 8%,transparent);padding:10px 12px;border-radius:6px;overflow:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:.5em 0;padding:0 0 0 12px;border-left:3px solid var(--bd);color:var(--mu)}
.md hr{border:0;border-top:1px solid var(--ln);margin:1em 0}.md a,.wl{color:var(--ac);text-decoration:none}.md a{text-decoration:underline}
.md mark{background:#e0de7160;color:inherit;border-radius:3px}.md img{max-width:100%;border-radius:4px}.mu{color:var(--mu)}
.fi{width:100%;height:100%;object-fit:contain;display:block}.in iframe{width:100%;height:100%;border:0;background:#fff}
.lk{padding:14px 16px;display:flex;flex-direction:column;gap:6px;height:100%;justify-content:center}.lk a{color:var(--ac);word-break:break-all}
.el{position:absolute;transform:translate(-50%,-50%) scale(var(--ls,1));padding:1px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);font-size:13px;white-space:nowrap}
.hit{outline:3px solid var(--ac);outline-offset:3px}.dim{opacity:.28}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.bt,button,input{font:inherit}
.bt,button{background:var(--ui);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer}

#ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);font-size:14px;text-shadow:0 0 6px var(--bg)}
input[type=search],input[type=text],input[type=password]{background:var(--ui);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;width:100%}
#q{width:180px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#mm{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:160px;height:110px;border:1px solid var(--ln);border-radius:8px;background:var(--ui);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;touch-action:none}
#em{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--mu);pointer-events:none;text-align:center;padding:20px}
#em button{pointer-events:auto}
#pn{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
.sh{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:12px;width:min(420px,calc(100% - 24px));background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sh h3,.sh h4{margin:0}.sh h4{color:var(--mu);font-size:13px;font-weight:600;margin-top:6px}
.row{display:flex;gap:8px}.it{display:block;width:100%;text-align:left;border-radius:8px;background:none;border:0;padding:8px 6px;border-bottom:1px solid var(--ln);backdrop-filter:none}
#ct{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ui);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.md table{border-collapse:collapse;margin:.6em 0;font-size:.95em}.md th,.md td{border:1px solid var(--ln);padding:4px 10px}.md th{font-weight:700;background:color-mix(in srgb,var(--tx) 5%,transparent)}
.co{margin:.6em 0;padding:10px 12px;border-radius:6px;background:rgba(var(--cc),.1)}.ct{display:flex;gap:8px;align-items:center;font-weight:600;color:rgb(var(--cc))}.cg{width:1.2em;text-align:center}.cb{margin-top:6px}.cb>*:first-child{margin-top:0}.cb>*:last-child{margin-bottom:0}summary.ct{cursor:pointer;list-style:none}summary.ct::-webkit-details-marker{display:none}
.katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
button,.bt,#q,#mm,#ct{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--card)}
.lt{display:none}.lod .in,.lod .ft,.lod .el{display:none}.lod .n{container-type:size}
center{display:block;text-align:center}.lod .lt{display:block;position:absolute;left:0;top:0;padding:calc(var(--fs)*.35);font-weight:600;line-height:1.2;font-size:clamp(var(--fm),calc(165cqw/var(--n)),var(--fs));white-space:nowrap;color:var(--tx)}
.lod .gl{font-size:var(--fs);margin-bottom:calc(var(--fs)*.4);padding:0 calc(var(--fs)*.5);border-radius:calc(var(--fs)*.5)}.lod #es path{stroke-width:4}
@media print{@page{size:420mm 297mm;margin:0}html,body{width:1587px;height:1123px;overflow:hidden}#bar,#mm,#pn,#ct,#em{display:none!important}#st{position:absolute!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
#sb{position:fixed;left:0;top:0;bottom:0;width:min(320px,85vw);z-index:8;background:var(--card);border-right:1px solid var(--ln);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto}
.sbh{display:flex;justify-content:space-between;align-items:center}#sb h4{margin:14px 0 4px;color:var(--mu);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.it2{position:relative;padding:8px 34px 8px 10px;border-radius:8px;cursor:pointer}.it2.on{background:color-mix(in srgb,var(--ac) 16%,transparent)}.it2 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it2 button{position:absolute;right:2px;top:8px;border:0;background:none;padding:2px 8px;color:var(--mu)}.s{font-size:12px}
.ol{padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.ol.g{font-weight:700;margin-top:6px}.ol.c{margin-left:16px}
.ol:active,.it2:active{background:color-mix(in srgb,var(--tx) 10%,transparent)}
@media print{#sb,#gc{display:none!important}}
#gc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}#es .e{stroke-width:var(--sw,2px)}.ah{transform-origin:0 0}
select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}#sgh{display:flex;flex-direction:column;gap:8px}
[hidden]{display:none!important}
</style></head><body>
<div id="st"><canvas id="gc"></canvas><div id="w"><svg id="es"></svg></div></div>
<div id="bar"><button id="sbt">Outliner</button><button id="mn">Öffnen</button><div id="ttl"></div><input id="q" type="search" placeholder="Suchen" enterkeyhint="search" hidden><button id="png" hidden>PNG</button><button id="pdf" hidden>PDF</button><button id="off" hidden>Offline</button></div>

<div id="sb" hidden><div class="sbh"><b>Outliner</b><button id="sbx">Schließen</button></div><h4>Zuletzt geöffnet</h4><div id="sr"></div><h4>Gliederung</h4><div id="so"></div></div>

</div></div>

<script>
const $=s=>document.querySelector(s),st=$('#st'),W=$('#w'),ES=$('#es'),mm=$('#mm');
const COL={1:'#fb464c',2:'#e9973f',3:'#e0de71',4:'#44cf6e',5:'#53dfdd',6:'#a882ff'};
const col=c=>c?(COL[c]||c):null;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let cfg=ld('cv:cfg',{}),rec=ld('cv:rec',[]),cur=null,V={x:0,y:0,k:1},NS=[],B=null,MS=null,HITS=[],hi=0;
const FB={};let EG=[],PR=0,PV=null,raf=0,lastMm=0,mt=0,MINK=.03,VEL={vx:0,vy:0,t:0},INER=0;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(t){const e=$('#ct');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}

/* ---------- Markdown ---------- */
const TG=h=>h.replace(/&lt;(\/?)(u|b|i|em|strong|s|del|mark|sub|sup|small|kbd|center|h[1-6])&gt;/gi,'<$1$2>').replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/&lt;\/?(?:div|span|font|p|a|img|details|summary)\b(?:(?!&gt;).)*&gt;/gi,'');
function inl(s){return esc(s).split(/(`[^`]*`)/).map((u,i)=>i%2?u:TG(u)).join('').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^\w*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/==(.+?)==/g,'<mark>$1</mark>')
.replace(/!\[\[([^\]|]+)[^\]]*\]\]/g,'<img data-p="$1">').replace(/!\[[^\]]*\]\(([^)]+)\)/g,'<img data-p="$1">')
.replace(/\[\[([^\]]+)\]\]/g,(m,a)=>{const p=a.split('|');return '<span class="wl">'+(p[1]||p[0].split('#')[0])+'</span>'})
.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md0(t){const o=[];let list=null,code=false,buf=[];const close=()=>{if(list){o.push('</'+list+'>');list=null}};
const li=(k,h)=>{if(list!=k){close();o.push('<'+k+'>');list=k}o.push(h)};
for(const l of t.split('\n')){let m;
if(/^```/.test(l)){if(code){o.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');buf=[];code=false}else{close();code=true}continue}
if(code){buf.push(l);continue}
if(m=l.match(/^(#{1,6})\s+(.*)/)){close();o.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`)}
else if(m=l.match(/^\s*[-*+]\s+\[( |x)\]\s+(.*)/i))li('ul',`<li class="t"><input type="checkbox" disabled ${m[1]!=' '?'checked':''}>${inl(m[2])}</li>`);
else if(m=l.match(/^\s*[-*+]\s+(.*)/))li('ul','<li>'+inl(m[1])+'</li>');
else if(m=l.match(/^\s*\d+[.)]\s+(.*)/))li('ol','<li>'+inl(m[1])+'</li>');
else if(/^>/.test(l)){close();o.push('<blockquote>'+inl(l.replace(/^>\s?/,''))+'</blockquote>')}
else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){close();o.push('<hr>')}
else if(/^\s*<\/?center>\s*$/i.test(l)){close();o.push(l.trim().toLowerCase())}
else if(!l.trim())close();else{close();o.push('<p>'+inl(l)+'</p>')}}
close();return o.join('')}

const X=[],SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,cells=l=>l.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim());
const ph=h=>'\u0002'+(X.push(h)-1)+'\u0002';
const mth=(a,d)=>ph(window.katex?katex.renderToString(a.trim(),{displayMode:!!d,throwOnError:false}):(mth.w=mth.w||(toast('KaTeX nicht gefunden: Ordner „katex“ mit ins Repo laden'),1),esc((d?'$$':'$')+a+(d?'$$':'$'))));
const CO={};[['8,109,221','✎','note info todo'],['0,191,188','✦','tip hint important abstract summary tldr'],['8,185,78','✓','success check done'],['236,117,0','?','question help faq'],['236,117,0','⚠','warning caution attention'],['233,49,71','✕','failure fail missing danger error bug'],['120,82,238','☰','example'],['158,158,158','❝','quote cite']].forEach(([c,g,l])=>l.split(' ').forEach(k=>CO[k]=[c,g]));
function md(t){X.length=0;
t=t.split(/(```[\s\S]*?```)/).map((s,i)=>i%2?s:s.replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>mth(a,1)).split(/(`[^`\n]*`)/).map((u,j)=>j%2?u:u.replace(/\$(?=\S)([^$\n]*?\S)\$/g,(m,a)=>mth(a,0))).join('')).join('');
const L=t.split('\n'),o=[];let f=false,m;
for(let i=0;i<L.length;i++){const l=L[i];
if(/^```/.test(l)){f=!f;o.push(l);continue}
if(f){o.push(l);continue}
if(l.includes('|')&&!SEP.test(l)&&SEP.test(L[i+1]||'')){const al=cells(L[i+1]).map(c=>/^:.*:$/.test(c)?'center':/:$/.test(c)?'right':'left');
let h='<table><thead><tr>'+cells(l).map((c,k)=>`<th style="text-align:${al[k]||'left'}">${inl(c)}</th>`).join('')+'</tr></thead><tbody>';i+=2;
for(;i<L.length&&L[i].includes('|')&&L[i].trim();i++)h+='<tr>'+cells(L[i]).map((c,k)=>`<td style="text-align:${al[k]||'left'}">${inl(c)}</td>`).join('')+'</tr>';i--;o.push(ph(h+'</tbody></table>'));continue}
if(m=l.match(/^>\s*\[!(\w+)\]([+-]?)\s*(.*)/)){const b=[];while(i+1<L.length&&/^>/.test(L[i+1]))b.push(L[++i].replace(/^>\s?/,''));
const ty=m[1].toLowerCase(),[c,g]=CO[ty]||CO.note,ti=`<span class="cg">${g}</span>${inl(m[3]||ty[0].toUpperCase()+ty.slice(1))}`,bd=`<div class="cb">${md0(b.join('\n'))}</div>`;
o.push(ph(m[2]?`<details class="co" style="--cc:${c}" ${m[2]=='+'?'open':''}><summary class="ct">${ti}</summary>${bd}</details>`:`<div class="co" style="--cc:${c}"><div class="ct">${ti}</div>${bd}</div>`));continue}
o.push(l)}
let s=md0(o.join('\n')).replace(/<p>\u0002(\d+)\u0002<\/p>/g,(a,n)=>X[n]);
for(let k=0;k<3;k++)s=s.replace(/\u0002(\d+)\u0002/g,(a,n)=>X[n]);return s}
/* ---------- GitHub ---------- */
async function gh(path,raw){
if(cfg.repo=='@self'){const r=await fetch(path.split('/').map(encodeURIComponent).join('/'));if(!r.ok)throw new Error(r.status);return r}
const u=`https://api.github.com/repos/${cfg.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}${cfg.branch?'?ref='+encodeURIComponent(cfg.branch):''}`;
const h={Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'};if(cfg.token)h.Authorization='Bearer '+cfg.token;
const r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return r}
const db=new Promise(r=>{try{const q=indexedDB.open('cv',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const kvGet=async k=>{const d=await db;if(!d)return;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const kvSet=async(k,v)=>{const d=await db;if(!d)return;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(1);t.onerror=()=>r(0)})};
async function fileBlob(p,force){
if(!cur||!cur.repo||/^https?:/.test(p))return null;
const dir=cur.path?cur.path.split('/').slice(0,-1).join('/'):'',cs=[p,dir?dir+'/'+p:p],K=c=>'f:'+cur.repo+'@'+cur.branch+':'+c;
if(!force)for(const c of cs){if(FB[c])return FB[c];const b=await kvGet(K(c));if(b)return FB[c]=b}
for(const c of cs){try{const b=await(await gh(c,true)).blob();FB[c]=b;kvSet(K(c),b);return b}catch{}}return null}
function fixImgs(el){el.querySelectorAll('img[data-p]').forEach(async i=>{const p=i.dataset.p;if(/^https?:/.test(p)){i.src=p;return}const b=await fileBlob(p);if(b)i.src=URL.createObjectURL(b);else i.alt=p})}

/* ---------- Rendering ---------- */
const ttl=n=>n.type=='file'?n.file.split('/').pop():n.type=='link'?n.url:(n.text||'').split('\n').map(l=>l.replace(/<\/?[a-z][^>]*>/gi,'').replace(/\[!\w+\][+-]?|^([>#*+\-\s]|\d+\.\s)+|\*\*|`|\[\[|\]\]|~~|==|\$/g,'').trim()).filter(Boolean).slice(0,1).join('');
function anchor(n,s){return s=='top'?[n.x+n.width/2,n.y]:s=='bottom'?[n.x+n.width/2,n.y+n.height]:s=='left'?[n.x,n.y+n.height/2]:[n.x+n.width,n.y+n.height/2]}
const DIR={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
function show(text,name,view){
let c;try{c=JSON.parse(text)}catch{toast('Keine gültige .canvas-Datei');return}
W.querySelectorAll('.n,.g,.el').forEach(e=>e.remove());ES.innerHTML='';EG=[];Object.keys(FB).forEach(k=>delete FB[k]);NS=c.nodes||[];const by={};
const order=[...NS.filter(n=>n.type=='group'),...NS.filter(n=>n.type!='group')];
for(const n of order){by[n.id]=n;const c1=col(n.color);const d=document.createElement('div');
d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.width}px;height:${n.height}px`;if(c1){d.style.setProperty('--c',c1)}
n.el=d;n.s=(n.text||n.file||n.url||n.label||'').toLowerCase();
if(n.type=='group'){d.className='g';d.innerHTML=n.label?`<div class="gl">${esc(n.label)}</div>`:''}
else{d.className='n'+(c1?' col':'');

const sb=$('#sb'),rk=r=>r.local?r.key:'cv:c:'+r.repo+'@'+(r.branch||'')+':'+r.path;

async function openRec(r){
if(r.local){const t=await kvGet(r.key);if(!t)return toast('Datei nicht mehr gespeichert');cur={local:true};localStorage.setItem('cv:last',JSON.stringify({local:1,key:r.key,name:r.name}));show(t,r.name);addRec(r)}
else{cfg={...cfg,repo:r.repo,branch:r.branch||''};localStorage.setItem('cv:cfg',JSON.stringify(cfg));await openCanvas(r.path)}
if(innerWidth<700)sb.hidden=true}
function renderSb(){const lk=(ld('cv:last',null)||{}).key,R=$('#sr');R.innerHTML=rec.length?'':'<div class="mu s">Noch nichts geöffnet.</div>';
rec.forEach(r=>{const d=document.createElement('div');d.className='it2'+(rk(r)==lk?' on':'');
d.innerHTML=`<div class="t">${esc(r.local?r.name:r.path.split('/').pop())}</div><div class="mu s">${esc(rl(r))}</div>`;
d.onclick=()=>openRec(r);const x=document.createElement('button');x.textContent='✕';x.onclick=e=>{e.stopPropagation();rec=rec.filter(y=>y!==r);localStorage.setItem('cv:rec',JSON.stringify(rec));renderSb()};d.appendChild(x);R.appendChild(d)});
renderOutline()}
function renderOutline(){const O=$('#so');O.innerHTML='';if(!NS.length){O.innerHTML='<div class="mu s">Kein Canvas geöffnet.</div>';return}
const gs=NS.filter(n=>n.type=='group'),rd=(a,b)=>a.y-b.y||a.x-b.x,ch=new Map(gs.sort(rd).map(g=>[g,[]])),free=[];
for(const n of NS){if(n.type=='group')continue;const cx=n.x+n.width/2,cy=n.y+n.height/2;let b=null;
for(const g of gs)if(cx>=g.x&&cx<=g.x+g.width&&cy>=g.y&&cy<=g.y+g.height&&(!b||g.width*g.height<b.width*b.height))b=g;b?ch.get(b).push(n):free.push(n)}
const add=(n,c)=>{const d=document.createElement('div');d.className='ol '+c;d.textContent=n.type=='group'?n.label||'Gruppe':ttl(n)||'(leer)';d.onclick=()=>{focusNode(n);if(innerWidth<700)sb.hidden=true};O.appendChild(d)};
for(const g of gs){add(g,'g');ch.get(g).sort(rd).forEach(n=>add(n,'c'))}
if(free.length){if(gs.length){const h=document.createElement('div');h.className='ol g mu';h.textContent='Ohne Gruppe';O.appendChild(h)}free.sort(rd).forEach(n=>add(n,gs.length?'c':''))}}
renderSb();

$('#off').onclick=async()=>{const fs=NS.filter(n=>n.type=='file');let i=0,ok=0;for(const n of fs){toast(`Lade ${++i}/${fs.length} …`);if(await fileBlob(n.file,true))ok++}toast(`${ok} von ${fs.length} Dateien offline gespeichert`)};
const endPrint=()=>{if(!PR)return;PR=0;document.body.classList.remove('pr');st.style.width=st.style.height='';Object.assign(V,PV);apply()};
addEventListener('afterprint',endPrint);st.addEventListener('pointerdown',endPrint,true);
$('#pdf').onclick=()=>{PV={...V};PR=1;document.body.classList.add('pr');st.style.width='1587px';st.style.height='1123px';fit(1587,1123);cull();toast('Teilen → „Sichern als PDF“ bzw. Drucken wählen');setTimeout(()=>print(),400)};
function wrap(x,n,t,tx){let y=n.y+10;const mw=n.width-32;
for(let l of t.split('\n')){const hd=l.match(/^(#{1,6})\s/),sz=hd?[0,28,24,20,18,16,16][hd[1].length]:16,lh=sz*1.4;
l=l.replace(/<\/?[a-z][^>]*>/gi,'').replace(/^#+\s|\*\*|`|\[\[|\]\]|~~|==/g,'').replace(/^\s*[-*+]\s+/,'• ');x.font=(hd?'700 ':'')+sz+'px -apple-system,sans-serif';x.fillStyle=tx;
if(!l.trim()){y+=8;continue}let ln='';
for(const w of l.split(' ')){const u=ln?ln+' '+w:w;if(x.measureText(u).width>mw&&ln){y+=lh;if(y-sz>n.y+n.height)return;x.fillText(ln,n.x+16,y);ln=w}else ln=u}
y+=lh;if(y-sz>n.y+n.height)return;x.fillText(ln,n.x+16,y)}}
$('#png').onclick=async()=>{if(!B)return;toast('Erstelle PNG …');
const cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim(),pad=60,w=B.w+pad*2,h=B.h+pad*2,s=Math.min(2,Math.sqrt(1.4e7/(w*h)),7800/Math.max(w,h));
const c=document.createElement('canvas');c.width=w*s|0;c.height=h*s|0;const x=c.getContext('2d');x.scale(s,s);x.fillStyle=v('--bg');x.fillRect(0,0,w,h);x.translate(pad-B.x,pad-B.y);
const F='-apple-system,BlinkMacSystemFont,sans-serif',tint=(k,a)=>{x.globalAlpha=a;x.fillStyle=k;x.fill();x.globalAlpha=1},rr=(n,r)=>{x.beginPath();x.roundRect(n.x,n.y,n.width,n.height,r)};
for(const n of NS.filter(n=>n.type=='group')){const k=col(n.color)||v('--bd');rr(n,14);tint(k,.08);x.strokeStyle=k;x.lineWidth=2;x.stroke();if(n.label){x.font='15px '+F;x.fillStyle=v('--tx');x.fillText(n.label,n.x+8,n.y-12)}}
x.lineWidth=2;
for(const e of EG){x.strokeStyle=x.fillStyle=e.c;x.beginPath();x.moveTo(...e.p);x.bezierCurveTo(...e.c_1,...e.c_2,...e.q);x.stroke();
if(e.to=='arrow'){const a=Math.atan2(e.q[1]-e.c_2[1],e.q[0]-e.c_2[0]);x.beginPath();x.moveTo(...e.q);x.lineTo(e.q[0]-10*Math.cos(a-.4),e.q[1]-10*Math.sin(a-.4));x.lineTo(e.q[0]-10*Math.cos(a+.4),e.q[1]-10*Math.sin(a+.4));x.fill()}
if(e.label){const m=[(e.p[0]+3*e.c_1[0]+3*e.c_2[0]+e.q[0])/8,(e.p[1]+3*e.c_1[1]+3*e.c_2[1]+e.q[1])/8];x.font='13px '+F;const tw=x.measureText(e.label).width;x.fillStyle=v('--bg');x.fillRect(m[0]-tw/2-8,m[1]-11,tw+16,22);x.fillStyle=v('--tx');x.fillText(e.label,m[0]-tw/2,m[1]+4)}}
for(const n of NS.filter(n=>n.type!='group')){const k=col(n.color)||v('--bd');rr(n,8);x.fillStyle=v('--card');x.fill();if(n.color)tint(k,.09);
x.save();rr(n,8);x.clip();
if(n.type=='file'){const b=await fileBlob(n.file);if(b&&b.type.startsWith('image')){try{const im=await createImageBitmap(b),r=Math.min(n.width/im.width,n.height/im.height);x.drawImage(im,n.x+(n.width-im.width*r)/2,n.y+(n.height-im.height*r)/2,im.width*r,im.height*r)}catch{}}else wrap(x,n,b&&/\.(md|txt)$/.test(n.file)?await b.text():n.file,v('--tx'))}
else wrap(x,n,n.type=='link'?n.url:n.text||'',v('--tx'));
x.restore();rr(n,8);x.strokeStyle=k;x.lineWidth=2;x.stroke()}
const bl=await new Promise(r=>c.toBlob(r,'image/png')),nm=($('#ttl').textContent||'canvas').replace(/\.canvas$/,'')+'.png',f=new File([bl],nm,{type:'image/png'});
const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=nm;a.click()};
if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(dl);else dl();toast('PNG fertig')};
(async()=>{const l=ld('cv:last',null);if(!l)return;cur=l.local?{local:true}:{repo:l.repo,branch:l.branch,path:l.path};if(!l.local)cfg={...cfg,repo:l.repo,branch:l.branch};
const t=await kvGet(l.key);if(t)show(t,l.name,ld('cv:view',null))})();
